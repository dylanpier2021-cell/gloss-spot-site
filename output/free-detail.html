<script>
(function(){
  var f=document.getElementById('entry'),err=document.getElementById('err'),go=document.getElementById('go');
  f.addEventListener('submit',function(e){
    e.preventDefault();err.textContent='';
    var fn=f.firstName.value.trim(),ph=f.phone.value.replace(/\D/g,'');
    if(!fn){err.textContent='Enter your first name.';return;}
    if(!(ph.length===10||(ph.length===11&&ph[0]==='1'))){err.textContent='Enter a valid 10-digit phone number.';return;}
    go.disabled=true;go.textContent='ENTERING...';
    fetch('/api/ghl-meet-entry',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({firstName:fn,lastName:f.lastName.value.trim(),phone:f.phone.value,consent:f.consent.checked})})
    .then(function(r){if(!r.ok)throw 0;f.style.display='none';document.getElementById('done').style.display='block';window.scrollTo(0,0);})
    .catch(function(){go.disabled=false;go.textContent='ENTER TO WIN';err.textContent='Something went wrong. Try again, or come to the Gloss Spot table and we\'ll sign you up.';});
  });
})();
</script>
